# =====================================================================
# BugReplay Database Configuration Example
# =====================================================================
# Instructions:
# 1. Copy this file to 'config.properties' in the project root directory.
# 2. Update the credentials below with your local MySQL username and password.
# 3. If MySQL is not running or credentials are not provided, BugReplay will
#    gracefully fall back to local JSON trace storage without crashing.
# =====================================================================

# Set to true to enable MySQL metadata recording, or false for JSON-only mode
db.enabled=true

# JDBC Connection URL
db.url=jdbc:mysql://localhost:3306/bugreplay?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# MySQL Username
db.username=root

# MySQL Password (leave blank if none, or enter your local MySQL password)
db.password=
